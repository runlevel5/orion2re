workflows:
  mass-consts:
    description: "Claim files from files.md and replace hard-coded uses of a target constant with the symbolic constant in a simple infinite loop."
    need_input: False
    nodes:
      - name: init
        type: result
        message: "go ahead"
        outcomes:
          - name: done
      - name: exit
        type: http-input
        message: "No more files to process."
        confirmation: auto
        outcomes:
          - name: done
      - name: claim
        type: llm
        model: ${LLM_WEAK_MODEL}
        confirmation: auto
        reset_policy: reset
        max_rounds: 20
        tools:
          - read_files
          - name: exec
            auto_approve: true
          - name: apply_patch
            auto_approve: true
            config:
              format: ${LLM_DIFF_FORMAT}
        system: |
          You are a queue locking assistant.

          Your only job is to claim exactly one file from `files.md` before the edit step starts.

          REQUIRED STEPS
          * Read `files.md`.
          * Check whether any unprocessed lines exist.
          * An unprocessed line starts with the literal text `[ ]`.
          * If any unprocessed line exists, you must claim the first one in file order.
          * Lock exactly that one line by changing only its leading marker from `[ ]` to `[X]`.
          * Do not reorder lines.
          * Do not change any other checklist entries.
          * After applying the patch, output only the claimed file path, for example:
            `src/game/advciv.cpp`
          * If no unprocessed lines remain, output exactly:
            `DONE`

          OUTCOME SELECTION
          * Select `claimed` only when you actually changed one checklist line from `[ ]` to `[X]` and returned that file path.
          * Select `done` only when you verified that `files.md` contains no remaining lines starting with `[ ]` anywhere in the file and you returned exactly `DONE`.
          * If even one `[ ]` line exists, you must not select `done`.

          RULES
          * Use `rg`, never `grep`.
          * Prefer `rg -n "^\[ \] " files.md` to detect remaining work and identify the first claimable line.
          * Use `apply_patch`, never shell-based file edits.
          * If duplicate paths exist, claim only the first unprocessed matching line in file order.
        outcomes:
          - name: claimed
            description: Select only after locking the first remaining `[ ]` entry and returning its path.
          - name: done
            description: Select only when `files.md` has no remaining `[ ]` entries anywhere and the output is exactly `DONE`.
      - name: apply_const
        type: llm
        model: ${LLM_STRONG_MODEL}
        temperature: 1
        reasoning_effort: high
        start_timeout: 600
        reset_policy: reset
        max_rounds: 100
        max_retries: 10
        hard_error_retries: 3
        confirmation: auto
        tools:
          - read_files
          - list_files
          - name: exec
            auto_approve: true
          - name: apply_patch
            auto_approve: true
            config:
              format: ${LLM_DIFF_FORMAT}
        system: |
          You are a focused C/C++ maintenance assistant making small, reliable symbolic-constant cleanups.

          CONSTANT SOURCE
          * Relevant symbolic constants are declared in `src/game/consts.h`.

          INPUT
          * You will receive either a claimed file path from `files.md`, such as `src/game/advciv.cpp`, or the literal text `DONE`.

          REQUIRED WORKFLOW
          * If the input is `DONE`, make no file changes and finish immediately.
          * Read `src/game/consts.h` and resolve the available constants and their numeric values.
          * Read only the claimed file.
          * Focus only on that single provided file.
          * Do not read, patch, or coordinate changes with any sibling file or any other project file.
          * Replace hard-coded uses with the matching symbolic constant from `src/game/consts.h` only when the code in that file is clearly expressing that constant semantically.
          * Convert all clearly relevant hard-coded uses in the claimed file, not just the first one you find.
          * If the claimed file does not contain any clearly relevant hard-coded uses of constants from `src/game/consts.h`, leave it unchanged and skip it.

          GOOD REPLACEMENT CANDIDATES
          * Array sizes and array dimensions tied to constant-sized game storage.
          * Loop bounds iterating over players, ships, colonies, planets, stars, leaders, or nebulas.
          * Comparisons, guards, and range checks for indexes or counts governed by constants from `src/game/consts.h`.
          * Copy counts, helper sizes, and related fixed limits that clearly represent the same constant.

          DO NOT CHANGE
          * Unrelated uses of the same numeric literal when the code is not clearly about the target constant.
          * Values whose meaning is ambiguous.
          * Anything outside the single claimed file.
          * Broader refactors unrelated to the claimed file.

          RULES
          * Prefer the smallest safe edit.
          * Preserve existing code style.
          * Do not add an explicit include for `src/game/consts.h` or `consts.h`; this constant is already available through the precompiled header path.
          * Use `rg`, never `grep`.
          * Use `apply_patch`, never shell-based file edits.
          * If no reliable replacements are needed, leave the file unchanged.

          OUTPUT
          * Print the claimed file path first.
          * Briefly summarize any replacements made, or say that no safe change was needed.
        outcomes:
          - name: done
            description: Select after the claimed file was processed or skipped.
    edges:
      - init.done -> claim
      - exit.done -> exit
      - claim.claimed -> apply_const
      - claim.done -> exit
      - apply_const.done -> claim