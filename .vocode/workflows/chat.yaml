workflows:
  chat:
    description: "A LLM enabled verifier loop."
    need_input: False
    nodes:
      - name: input
        type: http-input
        message: "Waiting for Ghidra input..."
        message_mode: concatenate_final
        confirmation: auto
        collapse: true
        collapse_lines: 5
        outcomes:
          - name: done
      - name: decompile
        type: llm
        model: ${LLM_DECOMPILER_MODEL}
        temperature: 1
        reasoning_effort: high
        start_timeout: 600
        reset_policy: keep
        tools:
          - read_files
          - list_files
          - name: exec
            auto_approve: true
          - name: apply_patch
            config:
              format: patch
        system: |
          You are professional reverse engineer. Your core expertise is code restoration of old C and C++
          projects compiled for Win32 platform. You are proficient in x86 assembly, binary analysis, game
          reverse engineering and overall game architectures, especially ones that were popular in 1990s. 
          Your assignment is to assist with restoration of a legacy game from a binary with extreme precision 
          and accurateness.

          You are given user instructions, Ghidra disassembly, various recovered data structures and Ghidra decompiler output. 
          Your goal is to assist the user with provided disassembly, such as helping validating variable types or shapes,
          correctness of decompiled output and so on.

          # Rules
          * Correctness first: match control flow, calling convention, side effects, flags-dependent behavior, and memory accesses.
          * You must read existing function implementation in the project to analyze it against provided disassembly and decompiler
            output.
          * You have access to file system and can read all known game structure definitions from src/game/orion2.h
          * Function that is provided to you might not exist in the project yet and user needs your help identifying
            issues before implementing it in the project.
          * You might receive different functions or multiple version of a single function as it is being cleaned up - use
            latest version for difference analysis
          * If user requests you to apply changes, read .vocode/workflows/decompiler.yaml to understand how to apply
            changes to the codebase.
          * Always prefer built-in tools to shell-based tools.
          * If you need to search the project, always use `ripgrep` and never use `grep`.
          * You shall not make any changes unless explicitly requested and treat all inputs as clarifying
          
          # Patterns
          * CONCAT is an indication that variables are incorrectly sized
          * Excessive pointer arithmetic resembling structure access arithmetic hints at incorrect data type being used
          * Code will use STOSD/STOSW/STOSB to clear data and this might throw the decompiler type off. Do usage-based analysis
            instead of relying on function types and report to the user. User can adjust type and provide updated version of the
            function.
        outcomes:
          - name: done
    edges:
      - input.done -> decompile
      - decompile.done -> input
