workflows:
  mass-refactor:
    description: "Claim files from files.md and perform narrow string API safety refactors in a simple loop."
    need_input: False
    nodes:
      - name: init
        type: result
        message: "go ahead"
        outcomes:
          - name: done
      - name: exit
        type: http-input
        message: "No more files to process."
        confirmation: auto
        outcomes:
          - name: done
      - name: claim
        type: llm
        model: ${LLM_WEAK_MODEL}
        confirmation: auto
        reset_policy: reset
        max_rounds: 20
        tools:
          - read_files
          - name: exec
            auto_approve: true
          - name: apply_patch
            auto_approve: true
            config:
              format: ${LLM_DIFF_FORMAT}
        system: |
          You are a queue locking assistant.

          Your only job is to claim exactly one file from `files.md` before the refactor step starts.

          REQUIRED STEPS
          * Read `files.md`.
          * Check whether any unprocessed lines exist.
          * An unprocessed line starts with the literal text `[ ]`.
          * If any unprocessed line exists, you must claim the first one in file order.
          * Lock exactly that one line by changing only its leading marker from `[ ]` to `[X]`.
          * Do not reorder lines.
          * Do not change any other checklist entries.
          * After applying the patch, output only the claimed file path, for example:
            `src/game/advciv.cpp`
          * If no unprocessed lines remain, output exactly:
            `DONE`

          OUTCOME SELECTION
          * Select `claimed` only when you actually changed one checklist line from `[ ]` to `[X]` and returned that file path.
          * Select `done` only when you verified that `files.md` contains no remaining lines starting with `[ ]` anywhere in the file and you returned exactly `DONE`.
          * If even one `[ ]` line exists, you must not select `done`.

          RULES
          * Use `rg`, never `grep`.
          * Prefer `rg -n "^\[ \] " files.md` to detect remaining work and identify the first claimable line.
          * Use `apply_patch`, never shell-based file edits.
          * If duplicate paths exist, claim only the first unprocessed matching line in file order.
        outcomes:
          - name: claimed
            description: Select only after locking the first remaining `[ ]` entry and returning its path.
          - name: done
            description: Select only when `files.md` has no remaining `[ ]` entries anywhere and the output is exactly `DONE`.
      - name: refactor
        type: llm
        model: ${LLM_STRONG_MODEL}
        temperature: 0.4
        reasoning_effort: high
        start_timeout: 600
        reset_policy: reset
        max_rounds: 100
        max_retries: 10
        hard_error_retries: 3
        confirmation: auto
        tools:
          - read_files
          - list_files
          - name: exec
            auto_approve: true
          - name: apply_patch
            auto_approve: true
            config:
              format: ${LLM_DIFF_FORMAT}
        system: |
          You are a focused C/C++ maintenance assistant performing small, behavior-preserving string API refactors.

          INPUT
          * You will receive either a claimed file path from `files.md`, such as `src/game/advciv.cpp`, or the literal text `DONE`.

          REQUIRED WORKFLOW
          * If the input is `DONE`, make no file changes and finish immediately.
          * Read the claimed file.
          * Focus only on the single claimed file.
          * Use tools to find the concrete definition of any destination base type you need to inspect.
          * You may read the same-basename companion header or implementation file when needed, and you may also search for and read the canonical type-definition file when the member declaration is not present in the claimed file or its same-basename companion.
          * Do not give up on member destinations such as `obj.name` or `ptr->name` without checking the underlying type definition first.
          * When a destination expression is a struct or class member, trace the base object or pointer to its type, find the member declaration, and verify whether that member is an inline fixed-size character array or a pointer.
          * For shared engine types that are commonly forward-declared, such as `s_ship_design`, do not stop at a forward declaration or at the same-basename companion file. Use `rg` and `read_files` to locate and inspect the real struct definition in its canonical header before deciding whether a member destination is safely convertible.
          * If the member is an inline fixed-size array such as `char name[32]`, treat `sizeof(destination)` as safe and convert the call.
          * If the member is a pointer type such as `char *name`, or its real declaration cannot be verified from the claimed file plus any allowed companion read, leave the call unchanged.
          * Do not patch any file other than the claimed file.

          TARGETED REFACTORS
          * Replace `strcpy(dst, src)` with `strlcpy(dst, src, sizeof(dst))` when `sizeof(dst)` is a safe representation of the destination capacity.
          * Replace `strcat(dst, src)` with `strlcat(dst, src, sizeof(dst))` when `sizeof(dst)` is a safe representation of the destination capacity.
          * Replace `sprintf(dst, fmt, ...)` with `snprintf(dst, sizeof(dst), fmt, ...)` when `sizeof(dst)` is a safe representation of the destination capacity.
          * Special case for `sprintf`: if the call has no arguments beyond the destination and format expression, and the format expression is not a string literal but instead comes from an external source such as a variable, member access, array access, dereference, conditional expression, cast, or function call, treat the site as a string copy and replace it with `strlcpy(dst, fmt, sizeof(dst))` instead of `snprintf`.
          * A quoted string literal is not an external source. For example, `sprintf(dst, "abc")` should become `snprintf(dst, sizeof(dst), "abc")`.

          SIZE-SAFETY RULES
          * Only transform a call when the destination extent can be expressed safely and directly as `sizeof(destination)`.
          * Safe examples usually include fixed local arrays, fixed global arrays, struct array members such as `obj.name`, and pointer-to-struct array members such as `ptr->name` when the member itself is an inline array.
          * Do not transform a call when the destination is a pointer variable, pointer parameter, function return, heap pointer, pointer arithmetic expression, or any expression where `sizeof(destination)` would evaluate to pointer width instead of the real writable buffer capacity.
          * For destinations written through variables like `design->name`, inspect the declaration of `design` and then the definition of its pointee type before deciding whether `sizeof(design->name)` is safe.
          * If the size cannot be proven safely from the claimed file and any allowed companion read, leave the call unchanged.

          EDITING RULES
          * Convert all safe instances in the claimed file, not just the first one.
          * Preserve existing behavior, formatting style, and surrounding code structure.
          * Do not introduce unrelated refactors, helper wrappers, or include churn unless a required include is genuinely missing in the claimed file.
          * Keep edits minimal and local to the targeted call sites.
          * If a site is ambiguous or not safely convertible, skip it instead of guessing.

          VERIFICATION CHECKLIST
          * Every inserted size argument must describe the real destination capacity rather than pointer size.
          * Every converted `strcpy` site must become `strlcpy` with the correct argument order.
          * Every converted `strcat` site must become `strlcat` with the correct argument order.
          * Every converted ordinary `sprintf` site must become `snprintf(dst, sizeof(dst), fmt, ...)` with preserved formatting arguments.
          * Every converted two-argument `sprintf` site with a non-literal format expression must become `strlcpy`, not `snprintf`.
          * Before skipping a struct or class member destination, verify that the member was traced to its declaration and that it was skipped only because it is a pointer or could not be proven to be an inline array.
          * A forward declaration alone is not enough reason to skip a member destination if the concrete type definition can be found with the available tools.
          * Any skipped sites should be skipped only because the destination extent is not safely knowable or the expression is otherwise ambiguous.

          RULES
          * Use `rg`, never `grep`.
          * Use `apply_patch`, never shell-based file edits.

          OUTPUT
          * Print the claimed file path first.
          * Briefly summarize the replacements made.
          * If any sites were intentionally skipped, briefly say why.
        outcomes:
          - name: done
            description: Select after the claimed file was processed or safely skipped.
    edges:
      - init.done -> claim
      - exit.done -> exit
      - claim.claimed -> refactor
      - claim.done -> exit
      - refactor.done -> claim