# Default Vocode configuration
logging:
  #default_level: debug
debugging:
  #capture_llm_payload: true
know_enabled: false
variables:
# OpenAI
  LLM_ARCHITECT_MODEL: chatgpt/gpt-5.6-sol
  LLM_ARCHITECT_REASONING: high
  LLM_STRONG_MODEL: chatgpt/gpt-5.6-sol
  LLM_MEDIUM_MODEL: chatgpt/gpt-5.6-terra
  LLM_WEAK_MODEL: chatgpt/gpt-5.6-luna
  LLM_REASONING: high
  LLM_DIFF_FORMAT: v4a
internal_http:
  port: 5050
default_workflow: "agent"
tools:
  - name: read_files
    auto_approve: true
  - name: summarize_files
    auto_approve: true
  - name: list_files
    auto_approve: true
  - name: search_project
    auto_approve: true
  - name: run_agent
    auto_approve: true
